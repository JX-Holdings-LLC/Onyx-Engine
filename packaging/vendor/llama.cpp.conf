# Vendor spec: llama.cpp, the source tree onyx-engine builds against.
#
# Read by packaging/make-vendor-package.sh and scripts/vendor.sh (sourced as
# Bash), scripts/install-vendor.js and CMakeLists.txt (parsed). Keep every
# setting a single KEY="value" line so all four readers agree.
#
# VENDOR_COMMIT          full 40-hex commit of VENDOR_UPSTREAM
# VENDOR_UPSTREAM_VERSION upstream's own CMake project version at that commit
# VENDOR_BUILD           upstream build number (llama.cpp's bNNNN tag), optional
# PKG_NAME               npm package the pruned tree is published as
# PKG_REPOSITORY         repository that packages it, optional (default: Onyx Engine)
# VENDOR_SPARSE          directories a fresh fetch checks out (top-level files always come along)
# VENDOR_PRUNE           paths removed from the staged tree
# VENDOR_KEEP            paths copied back after pruning
# VENDOR_REQUIRED        paths an installed tree must have
VENDOR_NAME="llama.cpp"
VENDOR_UPSTREAM="https://github.com/ggml-org/llama.cpp"
VENDOR_COMMIT="d77256999f211f8c0a5b12d13564f48d685b59e7"
VENDOR_UPSTREAM_VERSION="0.7.0"
VENDOR_BUILD="11820"
PKG_NAME="@jxburros/llama-cpp-source"
VENDOR_SPARSE="cmake common src ggml gguf-py include tools/mtmd vendor models"
VENDOR_PRUNE=".github .devops docs tests examples benches media pocs ci app conversion requirements requirements.txt models tools"
VENDOR_KEEP="models/ggml-vocab-llama-spm.gguf tools/mtmd"
VENDOR_REQUIRED="CMakeLists.txt gguf-py/gguf"

# Authoritative package version is mirrored from release.json.
RELEASE_PACKAGE_VERSION="0.7.0-b11820.gd77256999"
