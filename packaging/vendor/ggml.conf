# Vendor spec: standalone ggml (ggml-org/ggml), for the BackTrack audio apps.
#
# onyx-engine does not build this; it is the reference pin the audio apps
# copy, kept here so it moves together with the llama.cpp pin. The commit is
# the ggml revision the llama.cpp pin last synced (llama.cpp's
# scripts/sync-ggml.last); scripts/check-ggml-pin.sh checks that it still is.
# Same format and readers as llama.cpp.conf.
VENDOR_NAME="ggml"
VENDOR_UPSTREAM="https://github.com/ggml-org/ggml"
VENDOR_COMMIT="f1aa6a3465ffad40dadd390ac16b9deedd4e97f7"
VENDOR_UPSTREAM_VERSION="0.27.0"
VENDOR_BUILD=""
PKG_NAME="@jxburros/ggml-source"
VENDOR_SPARSE="cmake include src"
VENDOR_PRUNE=".github ci docs examples tests scripts requirements.txt"
VENDOR_KEEP=""
VENDOR_REQUIRED="CMakeLists.txt include/ggml.h include/gguf.h src/gguf.cpp"

# Authoritative package version is mirrored from release.json.
RELEASE_PACKAGE_VERSION="0.27.0-gf1aa6a346.1"
