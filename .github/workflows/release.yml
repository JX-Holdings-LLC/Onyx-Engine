name: Release
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
        - stable
        - preview
        default: stable
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true
      app:
        description: Optional app ID; empty selects every advanced app
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/plan.yml@d7f42f9910c075ef34915fa2b95cf28dd2be534a
    with:
      toolkit-ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
      channel: ${{ inputs.channel }}
      app: ${{ inputs.app }}
  build:
    strategy:
      fail-fast: false
      matrix:
        # platform-key is ${process.platform}-${process.arch}, plus a variant
        # suffix for builds JX Runtime's downloader does not pick by default.
        # x64 builds without a suffix assume AVX2; -baseline runs on any x86-64
        # CPU; -vulkan adds the Vulkan GPU backend (CPU fallback stays).
        include:
        - platform-key: linux-x64
          runs-on: ubuntu-22.04
          archive-ext: tar.gz
          bin-name: onyx-engine
          cmake-flags: -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
        - platform-key: linux-x64-baseline
          runs-on: ubuntu-22.04
          archive-ext: tar.gz
          bin-name: onyx-engine
          cmake-flags: ''
        # ubuntu-24.04: glslc, which the Vulkan shaders need, is packaged from
        # 23.04 on. The binary therefore needs glibc 2.39 or later.
        - platform-key: linux-x64-vulkan
          runs-on: ubuntu-24.04
          archive-ext: tar.gz
          bin-name: onyx-engine
          cmake-flags: -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DONYX_ENGINE_VULKAN=ON
        - platform-key: linux-arm64
          runs-on: ubuntu-22.04-arm
          archive-ext: tar.gz
          bin-name: onyx-engine
          cmake-flags: ''
        - platform-key: darwin-arm64
          runs-on: macos-latest
          archive-ext: tar.gz
          bin-name: onyx-engine
          cmake-flags: ''
        - platform-key: darwin-x64
          runs-on: macos-15-intel
          archive-ext: tar.gz
          bin-name: onyx-engine
          cmake-flags: -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
        - platform-key: win32-x64
          runs-on: windows-latest
          archive-ext: zip
          bin-name: onyx-engine.exe
          cmake-flags: -DGGML_AVX=ON -DGGML_AVX2=ON
        - platform-key: win32-x64-baseline
          runs-on: windows-latest
          archive-ext: zip
          bin-name: onyx-engine.exe
          cmake-flags: ''
        - platform-key: win32-x64-vulkan
          runs-on: windows-latest
          archive-ext: zip
          bin-name: onyx-engine.exe
          cmake-flags: -DGGML_AVX=ON -DGGML_AVX2=ON -DONYX_ENGINE_VULKAN=ON
    name: build (${{ matrix.platform-key }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve tag
      id: tag
      run: |
        echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Read llama.cpp pin
      id: pin
      run: |
        commit=$(sed -n 's/^VENDOR_COMMIT="\(.*\)"/\1/p' packaging/vendor/llama.cpp.conf)
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
    - name: Cache vendored llama.cpp source package
      id: vendor-cache
      uses: actions/cache@v6
      with:
        path: packaging/dist
        key: vendor-${{ steps.pin.outputs.commit }}-${{ hashFiles('packaging/make-vendor-package.sh', 'packaging/vendor/lib.sh',
          'packaging/vendor/llama.cpp.conf') }}
    - name: Stage vendor package (downloads the pinned commit)
      if: steps.vendor-cache.outputs.cache-hit != 'true'
      run: bash packaging/make-vendor-package.sh
    - name: Install vendor package
      run: bash scripts/vendor.sh --install-only
    - name: Install Vulkan build dependencies (Linux)
      if: contains(matrix.platform-key, 'vulkan') && runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc spirv-headers
    - name: Install Vulkan SDK (Windows)
      if: contains(matrix.platform-key, 'vulkan') && runner.os == 'Windows'
      shell: pwsh
      env:
        VULKAN_VERSION: 1.4.328.1
      run: |
        curl.exe -fsSL -o "$env:RUNNER_TEMP\vulkan-sdk.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
        & "$env:RUNNER_TEMP\vulkan-sdk.exe" --accept-licenses --default-answer --confirm-command install | Out-Host
        Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
        Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"
    - name: Configure (Release, static)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
          -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF ${{ matrix.cmake-flags }}
    - name: Configure (Release, static, MSVC)
      if: runner.os == 'Windows'
      run: cmake -B build -A x64 -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF ${{ matrix.cmake-flags }}
        -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
    - name: Build
      if: runner.os != 'Windows'
      run: cmake --build build --target onyx-engine --config Release -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
    - name: Build (MSVC)
      if: runner.os == 'Windows'
      run: cmake --build build --target onyx-engine --config Release
    - name: Locate binary
      id: locate
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          candidates="build/Release/onyx-engine.exe build/onyx-engine.exe"
        else
          candidates="build/onyx-engine build/Release/onyx-engine"
        fi
        for cand in $candidates; do
          if [ -f "$cand" ]; then
            echo "path=$cand" >> "$GITHUB_OUTPUT"
            echo "found $cand"
            exit 0
          fi
        done
        echo "::error::onyx-engine binary not found in any of: $candidates"
        exit 1
    - name: Sanity check (--version)
      run: '''${{ steps.locate.outputs.path }}'' --version'
    - name: Check release dynamic dependencies
      if: runner.os != 'Windows'
      run: |
        if [ "${{ runner.os }}" = Linux ]; then
          ldd '${{ steps.locate.outputs.path }}' | tee dependencies.txt
          if grep -Ei 'libgomp|libssl|libcrypto|not found' dependencies.txt; then
            echo "::error::unexpected release dependency"; exit 1
          fi
        else
          otool -L '${{ steps.locate.outputs.path }}' | tee dependencies.txt
          if grep -Ei '/opt/homebrew|/usr/local|libgomp|libssl|libcrypto' dependencies.txt; then
            echo "::error::unexpected release dependency"; exit 1
          fi
        fi
    - name: Package (tar.gz)
      if: matrix.archive-ext == 'tar.gz'
      run: |
        stage=$(mktemp -d)
        cp "${{ steps.locate.outputs.path }}" "$stage/${{ matrix.bin-name }}"
        cp LICENSE "$stage/LICENSE"
        cp third_party/cpp-httplib/LICENSE "$stage/LICENSE-cpp-httplib"
        cp node_modules/@jxburros/llama-cpp-source/LICENSE "$stage/LICENSE-llama.cpp"
        chmod +x "$stage/${{ matrix.bin-name }}"
        tar -czf "onyx-engine-${{ steps.tag.outputs.tag }}-${{ matrix.platform-key }}.tar.gz" \
            -C "$stage" "${{ matrix.bin-name }}" LICENSE LICENSE-cpp-httplib LICENSE-llama.cpp
    - name: Package (zip)
      if: matrix.archive-ext == 'zip'
      run: |
        stage=$(mktemp -d)
        cp "${{ steps.locate.outputs.path }}" "$stage/${{ matrix.bin-name }}"
        cp LICENSE "$stage/LICENSE"
        cp third_party/cpp-httplib/LICENSE "$stage/LICENSE-cpp-httplib"
        cp node_modules/@jxburros/llama-cpp-source/LICENSE "$stage/LICENSE-llama.cpp"
        (cd "$stage" && 7z a -tzip "$OLDPWD/onyx-engine-${{ steps.tag.outputs.tag }}-${{ matrix.platform-key }}.zip" \
            "${{ matrix.bin-name }}" LICENSE LICENSE-cpp-httplib LICENSE-llama.cpp)
    - name: Upload archive
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: onyx-engine-${{ matrix.platform-key }}
        path: onyx-engine-${{ steps.tag.outputs.tag }}-${{ matrix.platform-key }}.${{ matrix.archive-ext }}
        if-no-files-found: error
    needs:
    - plan
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['onyx-engine'].selected
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['onyx-engine'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['onyx-engine'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read
  release:
    name: publish release
    needs:
    - plan
    - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve tag
      id: tag
      run: |
        echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Download all archives
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: dist
        pattern: onyx-engine-*
        merge-multiple: true
    - name: Checksums
      run: |
        cd dist
        sha256sum onyx-engine-* > checksums.txt
        cat checksums.txt
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: JX-Holdings-LLC/release-infrastructure
        ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
        path: .toolkit
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Stage the complete configured release inventory
      shell: bash
      env:
        RELEASE_APP: onyx-engine
      run: node .toolkit/src/release.mjs stage --app "$RELEASE_APP" --from dist --bundle unified-bundle --sha "$RELEASE_SOURCE_SHA"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: bundle-onyx-engine
        path: unified-bundle
        if-no-files-found: error
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['onyx-engine'].selected
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['onyx-engine'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['onyx-engine'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
  publish-onyx-engine:
    needs:
    - plan
    - release
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['onyx-engine'].selected
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/finish.yml@d7f42f9910c075ef34915fa2b95cf28dd2be534a
    permissions:
      contents: write
    with:
      toolkit-ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
      source-sha: ${{ needs.plan.outputs.sha }}
      app: onyx-engine
      security: standard
      artifact: bundle-onyx-engine
      dry-run: ${{ inputs.dry_run }}
  # The CPU container image, built from the same source SHA. A dry run builds
  # it without pushing; a real run pushes ghcr.io/<owner>/onyx-engine:<version>
  # and :latest (stable channel only) after the GitHub release is published.
  docker-onyx-engine:
    name: container image
    needs:
    - plan
    - publish-onyx-engine
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['onyx-engine'].selected
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['onyx-engine'].version }}
      DRY_RUN: ${{ inputs.dry_run }}
      CHANNEL: ${{ inputs.channel }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
    - name: Image name
      id: image
      run: |
        image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/onyx-engine"
        tags="$image:$RELEASE_VERSION"
        if [ "$CHANNEL" = stable ]; then tags="$tags,$image:latest"; fi
        echo "tags=$tags" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      if: inputs.dry_run == false
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        target: cpu
        platforms: linux/amd64
        push: ${{ inputs.dry_run == false }}
        tags: ${{ steps.image.outputs.tags }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
          org.opencontainers.image.licenses=MIT
    - name: Smoke-check the image
      run: |
        docker buildx build --load --target cpu -t onyx-engine:check .
        docker run --rm --entrypoint onyx-engine onyx-engine:check --version
  build-vendor-llama-cpp:
    runs-on: ubuntu-latest
    needs:
    - plan
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vendor-llama-cpp'].selected
    env:
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - run: bash packaging/make-vendor-package.sh --spec llama.cpp
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: JX-Holdings-LLC/release-infrastructure
        ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
        path: .toolkit
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Stage the complete configured release inventory
      shell: bash
      env:
        RELEASE_APP: vendor-llama-cpp
      run: node .toolkit/src/release.mjs stage --app "$RELEASE_APP" --from packaging/dist/llama.cpp --bundle unified-bundle
        --sha "$RELEASE_SOURCE_SHA"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: bundle-vendor-llama-cpp
        path: unified-bundle
        if-no-files-found: error
  registry-vendor-llama-cpp:
    runs-on: ubuntu-latest
    needs:
    - plan
    - build-vendor-llama-cpp
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vendor-llama-cpp'].selected
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: bundle-vendor-llama-cpp
        path: package-output
    - name: Publish the verified source package
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        DRY_RUN: ${{ inputs.dry_run }}
        PACKAGE_NAME: '@jxburros/llama-cpp-source'
        PACKAGE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['vendor-llama-cpp'].version }}
      run: |
        # ./ prefix: npm 11 reads a bare "dir/file.tgz" as GitHub owner/repo shorthand.
        file=$(find ./package-output -name '*.tgz' -print -quit)
        if [ "$DRY_RUN" = true ]; then npm publish "$file" --ignore-scripts --access public --dry-run; exit 0; fi
        if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then echo 'Package already exists; refusing an ambiguous overwrite/retry.'; exit 1; fi
        npm publish "$file" --ignore-scripts --access public --provenance --tag next
  publish-vendor-llama-cpp:
    needs:
    - plan
    - build-vendor-llama-cpp
    - registry-vendor-llama-cpp
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vendor-llama-cpp'].selected
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/finish.yml@d7f42f9910c075ef34915fa2b95cf28dd2be534a
    permissions:
      contents: write
    with:
      toolkit-ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
      source-sha: ${{ needs.plan.outputs.sha }}
      app: vendor-llama-cpp
      security: standard
      artifact: bundle-vendor-llama-cpp
      dry-run: ${{ inputs.dry_run }}
  build-vendor-ggml:
    runs-on: ubuntu-latest
    needs:
    - plan
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vendor-ggml'].selected
    env:
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - run: bash packaging/make-vendor-package.sh --spec ggml
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: JX-Holdings-LLC/release-infrastructure
        ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
        path: .toolkit
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Stage the complete configured release inventory
      shell: bash
      env:
        RELEASE_APP: vendor-ggml
      run: node .toolkit/src/release.mjs stage --app "$RELEASE_APP" --from packaging/dist/ggml --bundle unified-bundle
        --sha "$RELEASE_SOURCE_SHA"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: bundle-vendor-ggml
        path: unified-bundle
        if-no-files-found: error
  registry-vendor-ggml:
    runs-on: ubuntu-latest
    needs:
    - plan
    - build-vendor-ggml
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vendor-ggml'].selected
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: bundle-vendor-ggml
        path: package-output
    - name: Publish the verified source package
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        DRY_RUN: ${{ inputs.dry_run }}
        PACKAGE_NAME: '@jxburros/ggml-source'
        PACKAGE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['vendor-ggml'].version }}
      run: |
        # ./ prefix: npm 11 reads a bare "dir/file.tgz" as GitHub owner/repo shorthand.
        file=$(find ./package-output -name '*.tgz' -print -quit)
        if [ "$DRY_RUN" = true ]; then npm publish "$file" --ignore-scripts --access public --dry-run; exit 0; fi
        if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then echo 'Package already exists; refusing an ambiguous overwrite/retry.'; exit 1; fi
        npm publish "$file" --ignore-scripts --access public --provenance --tag next
  publish-vendor-ggml:
    needs:
    - plan
    - build-vendor-ggml
    - registry-vendor-ggml
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vendor-ggml'].selected
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/finish.yml@d7f42f9910c075ef34915fa2b95cf28dd2be534a
    permissions:
      contents: write
    with:
      toolkit-ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
      source-sha: ${{ needs.plan.outputs.sha }}
      app: vendor-ggml
      security: standard
      artifact: bundle-vendor-ggml
      dry-run: ${{ inputs.dry_run }}
