# Pin bump: once a month, and on demand, move the llama.cpp pin to upstream's
# latest release (and the ggml pin to the revision it synced) and open a draft
# pull request carrying the diff of every upstream header Onyx compiles
# against. scripts/bump-llama-pin.sh does the work and runs the same way
# locally; this workflow only commits, validates, pushes and opens the PR.
#
# A pull request opened with the default GITHUB_TOKEN does not start other
# workflows, so after opening it this workflow dispatches ci.yml on the branch
# (workflow_dispatch is the exception GitHub allows). Store a fine-grained
# token with contents and pull-requests write access as the PIN_BUMP_TOKEN
# secret to have the PR's own checks (ci, versions) run instead; without one,
# closing and reopening the PR runs them. The repository setting "Allow GitHub
# Actions to create and approve pull requests" must be on either way.
#
# One branch per release (pin-bump/bNNNN): a release already proposed, merged
# or not, is skipped, so delete the branch to propose it again.
name: pin-bump

permissions:
  contents: read

'on':
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      build:
        description: llama.cpp release tag (bNNNN), or latest
        type: string
        default: latest
      dry_run:
        description: Compute the bump and the header diff without opening a pull request
        type: boolean
        default: true

concurrency:
  group: pin-bump-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump:
    # Scheduled runs only in this repository, not in forks.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'JX-Holdings-LLC/Onyx-Engine'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BUILD: ${{ inputs.build || 'latest' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # The branch the run started from: main on schedule.
      BASE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.PIN_BUMP_TOKEN || github.token }}

      # The release toolkit advances the versions; same pin as release.yml and
      # release-validation.yml (keep the three equal).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: JX-Holdings-LLC/release-infrastructure
          ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
          path: .toolkit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Bump the pins
        id: bump
        run: |
          echo "OUT=$RUNNER_TEMP/pin-bump" >> "$GITHUB_ENV"
          OUT=$RUNNER_TEMP/pin-bump
          args=(--out "$OUT" --build "$BUILD")
          [ "$DRY_RUN" != true ] || args+=(--dry-run)
          bash scripts/bump-llama-pin.sh "${args[@]}"

      - name: Upload the header diff and PR body
        if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pin-bump
          path: ${{ env.OUT }}
          if-no-files-found: error

      - name: Look for an earlier proposal
        id: earlier
        if: steps.bump.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::notice::$BRANCH already exists; delete it to propose this release again"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, validate, push and open the pull request
        if: steps.bump.outputs.changed == 'true' && env.DRY_RUN != 'true' && steps.earlier.outputs.exists != 'true'
        env:
          BRANCH: ${{ steps.bump.outputs.branch }}
          TITLE: ${{ steps.bump.outputs.title }}
          GH_TOKEN: ${{ secrets.PIN_BUMP_TOKEN || github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=$(git rev-parse HEAD)
          git switch -c "$BRANCH"
          git add -A -- . ':!.toolkit'
          git commit -q -m "$TITLE" -m "Generated by scripts/bump-llama-pin.sh (.github/workflows/pin-bump.yml)."
          node .toolkit/src/release.mjs validate --base "$base"
          git push origin "$BRANCH"
          gh pr create --draft --base "$BASE_BRANCH" --head "$BRANCH" --title "$TITLE" --body-file "$OUT/pr-body.md"

      - name: Run CI on the branch
        if: steps.bump.outputs.changed == 'true' && env.DRY_RUN != 'true' && steps.earlier.outputs.exists != 'true'
        env:
          BRANCH: ${{ steps.bump.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          HAS_PAT: ${{ secrets.PIN_BUMP_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" = true ]; then
            echo "The pull request's own checks run (PIN_BUMP_TOKEN)."
          else
            gh workflow run ci.yml --ref "$BRANCH"
          fi

      - name: Summary
        if: always()
        env:
          CHANGED: ${{ steps.bump.outputs.changed }}
          TARGET: ${{ steps.bump.outputs.build }}
        run: |
          if [ "$CHANGED" = true ] && [ -f "$OUT/pr-body.md" ]; then
            cat "$OUT/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CHANGED" = false ]; then
            echo "llama.cpp is already pinned at or past ${TARGET:-the target}." >> "$GITHUB_STEP_SUMMARY"
          fi
