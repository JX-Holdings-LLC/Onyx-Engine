# jx-engine CI: build against the pinned vendored llama.cpp source and run
# the full offline test suite (no model downloads - all test models are
# generated by scripts/).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read llama.cpp pin
        id: pin
        run: |
          commit=$(sed -n 's/^LLAMA_COMMIT="\(.*\)"/\1/p' packaging/make-vendor-package.sh)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Cache vendored llama.cpp source package
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: packaging/dist
          key: vendor-${{ steps.pin.outputs.commit }}-${{ hashFiles('packaging/make-vendor-package.sh') }}

      - name: Stage vendor package (downloads the pinned commit)
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: bash packaging/make-vendor-package.sh

      - name: Install vendor package
        run: npm install ./packaging/dist/jxburros-llama-cpp-source-*.tgz --no-save

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ matrix.os }}-${{ steps.pin.outputs.commit }}

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --target jx-engine -j 4

      - name: Install test dependencies (numpy)
        run: python3 -m pip install --break-system-packages numpy || python3 -m pip install numpy

      - name: Smoke tests (endpoints, slots, context shift, logprobs, reasoning budget, mmproj)
        run: bash scripts/smoke-test.sh

      - name: Safetensors conversion tests
        run: bash scripts/safetensors-test.sh
