# onyx-engine CI: build against the pinned vendored llama.cpp source and run
# the full offline test suite (no model downloads - all test models are
# generated by scripts/).
#
# Every leg builds, runs the C++ unit tests (ctest) and the smoke suite; the
# safetensors conversion test runs on linux and macos. The build-paths job
# proves the two ways a contributor builds from a clone: CMake alone (no
# Node; CMake fetches llama.cpp) and npm ci && npm run build.
#
# All jobs run on GitHub-hosted runners for now; to move linux back to the
# org self-hosted runner, set its runs-on to [self-hosted, linux, x64] and
# use-ccache-action to false (the runner needs cmake, build-essential, curl,
# python3, python3-venv, python3-pip — the preflight step lists any gaps).
# Test-only python deps (numpy for the model generators and converter;
# pyyaml/tqdm/requests for the vendored gguf-py that make-tiny-model.py
# reads the vocab with) are installed into a job-local venv so no runner is
# ever polluted.
name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs-on: ubuntu-latest
            use-ccache-action: true
            run-tests: true
          - name: macos
            runs-on: macos-latest
            use-ccache-action: true
            run-tests: true
          # Windows first existed to catch toolchain and MSVC-portability
          # breakage before a release (the first v0.3.0 release run failed
          # at configure because release.yml pinned a Visual Studio generator
          # the runner image no longer shipped). It now runs the unit tests
          # and the smoke suite too, under Git Bash; the safetensors test is
          # left to linux and macos (its converter checks are not
          # platform-specific). ccache is skipped (the action does not help
          # MSVC).
          - name: windows
            runs-on: windows-latest
            use-ccache-action: false
            run-tests: true
    name: build-and-test (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    defaults:
      run:
        # bash on every platform (git-bash on Windows) so the vendor-staging
        # steps below are shared verbatim with release.yml.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Verify every tool this job needs in one pass and fail with the
      # complete list — instant on GitHub-hosted runners, and the provisioning
      # checklist if the job is ever moved to a self-hosted runner.
      # (Debian/Ubuntu: the tools below come from cmake, build-essential,
      # curl, python3, python3-venv, python3-pip.)
      - name: Check required build tools
        if: matrix.name == 'linux'
        run: |
          missing=""
          for t in cmake g++ make git npm tar python3; do
            command -v "$t" > /dev/null || missing="$missing $t"
          done
          if command -v python3 > /dev/null; then
            python3 -m venv /tmp/.venv-probe > /dev/null 2>&1 && rm -rf /tmp/.venv-probe || missing="$missing python3-venv"
          fi
          if [ -n "$missing" ]; then
            echo "::error::self-hosted runner is missing required tools:$missing (see the workflow comment for the package list)"
            exit 1
          fi

      - name: Read llama.cpp pin
        id: pin
        run: |
          commit=$(sed -n 's/^VENDOR_COMMIT="\(.*\)"/\1/p' packaging/vendor/llama.cpp.conf)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Cache vendored llama.cpp source package
        id: vendor-cache
        uses: actions/cache@v6
        with:
          path: packaging/dist
          key: vendor-${{ steps.pin.outputs.commit }}-${{ hashFiles('packaging/make-vendor-package.sh', 'packaging/vendor/lib.sh', 'packaging/vendor/llama.cpp.conf') }}

      - name: Stage vendor package (downloads the pinned commit)
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: bash packaging/make-vendor-package.sh

      # Extracted with tar rather than `npm install` so self-hosted runners
      # need no npm; the layout is identical (CMake looks for
      # node_modules/@jxburros/llama-cpp-source/CMakeLists.txt).
      - name: Install vendor package
        run: bash scripts/vendor.sh --install-only

      - name: ccache (GitHub-hosted only)
        if: matrix.use-ccache-action == true
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: build-${{ matrix.name }}-${{ steps.pin.outputs.commit }}

      - name: Configure
        if: runner.os != 'Windows'
        run: |
          launcher_flags=""
          if command -v ccache > /dev/null; then
            launcher_flags="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $launcher_flags

      # No -G: CMake picks whichever Visual Studio it finds, so a runner
      # image bumping its VS version does not break the build (same note in
      # release.yml). Multi-config generator, so the configuration is chosen
      # at build time with --config.
      # Static, exactly as release.yml builds the shipped win32-x64 binary.
      # A shared build puts ggml/llama/mtmd DLLs under build/bin/Release/
      # while the exe lands in build/Release/, so the exe cannot even start
      # (the loader fails before main; bash reports exit 127) — and it is the
      # static configuration that a release has to prove anyway.
      - name: Configure (MSVC)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64 -DBUILD_SHARED_LIBS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --target onyx-engine -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Build (MSVC)
        if: runner.os == 'Windows'
        run: cmake --build build --target onyx-engine --config Release

      - name: Sanity check (--version)
        id: bin
        run: |
          for cand in build/onyx-engine build/Release/onyx-engine.exe build/onyx-engine.exe; do
            if [ -f "$cand" ]; then "$cand" --version; echo "path=$cand" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "::error::onyx-engine binary not found after build"
          exit 1

      - name: Unit tests (ctest)
        run: |
          cmake --build build --target onyx-unit-tests --config Release -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          ctest --test-dir build -C Release --output-on-failure

      - name: Install test dependencies (job-local venv)
        if: matrix.run-tests
        run: |
          py=$(command -v python3 || command -v python)
          "$py" -m venv .ci-venv
          bin=.ci-venv/bin; [ -d .ci-venv/Scripts ] && bin=.ci-venv/Scripts
          "$bin/python" -m pip install --quiet numpy pyyaml tqdm requests
          echo "$PWD/$bin" >> "$GITHUB_PATH"

      - name: Smoke tests (endpoints, slots, context shift, logprobs, reasoning budget, mmproj, readiness, operations)
        if: matrix.run-tests
        run: bash scripts/smoke-test.sh "${{ steps.bin.outputs.path }}"

      - name: Safetensors conversion tests
        if: matrix.run-tests && runner.os != 'Windows'
        run: bash scripts/safetensors-test.sh

  # The two documented ways to build from a clone. cmake-only has no Node at
  # all: the first configure fetches the pinned llama.cpp with Git into
  # .deps/llama.cpp. npm runs npm ci (install-vendor.js) and npm run build.
  build-paths:
    strategy:
      fail-fast: false
      matrix:
        path: [cmake-only, npm]
    name: build-paths (${{ matrix.path }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: build-paths-${{ matrix.path }}
      - name: Build with CMake alone (preset)
        if: matrix.path == 'cmake-only'
        run: |
          ! command -v node > /dev/null || sudo rm -f "$(command -v node)" "$(command -v npm)"
          cmake --preset release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset release -j "$(nproc)"
          test -f .deps/llama.cpp/.vendor-source-commit
          [ "$(cat .deps/llama.cpp/.vendor-source-commit)" = "$(sed -n 's/^VENDOR_COMMIT="\(.*\)"/\1/p' packaging/vendor/llama.cpp.conf)" ]
          build/release/onyx-engine --version
      - name: Build with npm
        if: matrix.path == 'npm'
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          npm ci
          npm run build
          build/onyx-engine --version
