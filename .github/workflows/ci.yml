# jx-engine CI: build against the pinned vendored llama.cpp source and run
# the full offline test suite (no model downloads - all test models are
# generated by scripts/).
#
# Linux runs on the organization's self-hosted runner; macOS stays on
# GitHub-hosted. Test-only python deps (numpy for the model generators and
# converter; pyyaml/tqdm/requests for the vendored gguf-py that
# make-tiny-model.py reads the vocab with) are installed into a job-local
# venv so self-hosted runners are never polluted.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs-on: [self-hosted, linux, x64]
            use-ccache-action: false   # self-hosted: local ccache/persistent disk, no action needed
          - name: macos
            runs-on: macos-latest
            use-ccache-action: true
    name: build-and-test (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read llama.cpp pin
        id: pin
        run: |
          commit=$(sed -n 's/^LLAMA_COMMIT="\(.*\)"/\1/p' packaging/make-vendor-package.sh)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Cache vendored llama.cpp source package
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: packaging/dist
          key: vendor-${{ steps.pin.outputs.commit }}-${{ hashFiles('packaging/make-vendor-package.sh') }}

      - name: Stage vendor package (downloads the pinned commit)
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: bash packaging/make-vendor-package.sh

      - name: Install vendor package
        run: npm install ./packaging/dist/jxburros-llama-cpp-source-*.tgz --no-save

      - name: ccache (GitHub-hosted only)
        if: matrix.use-ccache-action == true
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ matrix.name }}-${{ steps.pin.outputs.commit }}

      - name: Configure
        run: |
          launcher_flags=""
          if command -v ccache > /dev/null; then
            launcher_flags="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $launcher_flags

      - name: Build
        run: cmake --build build --target jx-engine -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Install test dependencies (job-local venv)
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --quiet numpy pyyaml tqdm requests
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Smoke tests (endpoints, slots, context shift, logprobs, reasoning budget, mmproj)
        run: bash scripts/smoke-test.sh

      - name: Safetensors conversion tests
        run: bash scripts/safetensors-test.sh
